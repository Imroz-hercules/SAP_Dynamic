# Test gate for SAP_Dynamic.
#
# WHY THIS EXISTS. Before 2026-08-22 this repository had exactly one workflow: ota-deploy.yml,
# which on every push to main did `git reset --hard && git clean -fd`, reinstalled dependencies
# and restarted the live Backend and Frontend services -- with nothing running first. 25
# test_*.py files existed and `pytest` appeared nowhere in requirements.txt, so they were
# inventory rather than a gate.
#
# This runs 50 of them on every push and pull request. It does NOT deploy anything.
#
# SCOPE. This runs on the personal mirror (MohamedAlLami/SAP_Dynamic). Nothing here is pushed
# upstream, and the upstream deploy path is unchanged.

name: ci

on:
  push:
    branches: ['**']
  pull_request:

# Read-only by default. This workflow needs nothing else, and a token that cannot write is a
# token that cannot be turned against the repository by the code it executes.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # database.py reads these at IMPORT time and raises without them, so every test module that
    # imports the app dies at collection. sqlite URLs are deliberate: SQLAlchemy resolves the
    # DBAPI when the engine is constructed, so pointing MSSQL at sqlite avoids needing pyodbc and
    # the unixODBC system headers it builds against. Nothing here connects to anything -- the 50
    # selected tests are pure logic, and the 17 that genuinely need a database are deselected in
    # backend/pytest.ini.
    env:
      MSSQL_ENABLED: 'false'
      MSSQL_URL: 'sqlite:///:memory:'
      POSTGRES_URL: 'sqlite:///:memory:'
      JWT_SECRET: 'ci-only-not-a-real-secret'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Deliberately NOT `-r requirements.txt`: that pulls psycopg2-binary and pyodbc, which need
      # system database drivers this runner does not have and which none of the 50 selected tests
      # touch. This is the set the backend actually imports, minus those two.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            pytest==8.3.4 \
            SQLAlchemy==2.0.23 \
            Flask==3.0.0 \
            flask-cors==4.0.0 \
            Werkzeug==3.0.1 \
            python-dotenv==1.0.0 \
            bcrypt==4.1.2 \
            PyJWT==2.8.0 \
            requests==2.31.0 \
            schedule==1.2.1 \
            APScheduler==3.10.4 \
            python-dateutil==2.8.2 \
            pytz==2023.3 \
            openpyxl==3.1.2 \
            colorlog==6.8.0

      - name: Show what will run
        working-directory: backend
        run: python -m pytest --collect-only -q | tail -3

      - name: Run tests
        working-directory: backend
        run: python -m pytest

      # A gate that has never failed has never been shown to discriminate. This proves the job
      # actually executes the suite rather than passing because nothing ran -- the failure mode
      # this project has hit repeatedly. It writes a deliberately broken test, requires the runner
      # to FAIL on it, then removes it.
      - name: Canary — prove the gate can fail
        working-directory: backend
        run: |
          printf 'def test_canary_must_fail():\n    assert False, "canary"\n' > test_zzz_canary.py
          if python -m pytest test_zzz_canary.py -q; then
            rm -f test_zzz_canary.py
            echo "::error::CANARY PASSED — the gate does not actually fail on a failing test"
            exit 1
          fi
          rm -f test_zzz_canary.py
          echo "canary failed as required — the gate discriminates"
